name: Weekly GitHub Insights Report

on:
  # Run every Monday at 00:00 UTC
  schedule:
    - cron: '0 0 * * 1'
  
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      log_level:
        description: 'Log level'
        required: false
        default: 'info'
        type: choice
        options:
          - debug
          - info
          - warn
          - error

# A scheduled and a manual run must never overlap: both would pick the same week.
concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  generate-report:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      
      - name: Install dependencies
        run: go mod download
      
      - name: Build application
        run: go build -o ai-repo-insights ./cmd/ai-repo-insights/
      
      - name: Generate report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: ./ai-repo-insights -log-level "${{ github.event.inputs.log_level || 'info' }}"

      - name: Commit and push report
        id: publish
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Get the report date
          REPORT_DATE=$(date +%Y-%m-%d)
          
          # Add generated files
          git add data/weekly/ data/history.json
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Add weekly radar issue for $REPORT_DATE"
            git push
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with GITHUB_TOKEN starts no other workflow, so the site
      # deploy is requested directly. DEPLOY_TOKEN is a PAT with repo scope on
      # NoSugarCoffee/NoSugarCoffee.github.io.
      - name: Trigger site deploy
        if: steps.publish.outputs.published == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEPLOY_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'NoSugarCoffee',
              repo: 'NoSugarCoffee.github.io',
              event_type: 'radar-updated',
            });
      
      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-report
          path: |
            data/weekly/*.json
          retention-days: 90
